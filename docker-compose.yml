services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-pernstore}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-pernstore_local}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-pernstore}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 9000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-pernstore}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-pernstore_local}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-pernstore}
      POSTGRES_DB_TEST: ${LOCAL_POSTGRES_DB_TEST:-pernstore_test}
      SECRET: ${LOCAL_APP_SECRET:-local-development-secret}
      REFRESH_SECRET: ${LOCAL_REFRESH_SECRET:-local-development-refresh-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      REFRESH_TOKEN: ${REFRESH_TOKEN:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
    command:
      [
        "sh",
        "-c",
        "npm run migrate -- up && npx nodemon --legacy-watch index.js",
      ]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:9000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: http://localhost:9000/api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_STRIPE_PUB_KEY: ${VITE_STRIPE_PUB_KEY:-}
        VITE_PAYSTACK_PUB_KEY: ${VITE_PAYSTACK_PUB_KEY:-}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Note: volumes wali line hum ne remove kar di hai!
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    
  promtail:
    build:
      context: .
      dockerfile: Dockerfile.promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
    # Note: config.yml wala volume remove kar diya, lekin docker.sock abhi bhi chahiye
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped


volumes:
  postgres_data:
