name: Build and deploy ECS services

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Serialize deployments to this ECS environment.
  group: pern-store-ecs-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECS_CLUSTER: pern-store-dev-cluster
  FRONTEND_ECR_REPO: store/frontend
  BACKEND_ECR_REPO: store/backend
  FRONTEND_ECS_SERVICE: pern-store-dev-frontend
  BACKEND_ECS_SERVICE: pern-store-dev-backend
  FRONTEND_TASK_FAMILY: pern-store-dev-frontend
  BACKEND_TASK_FAMILY: pern-store-dev-backend
  MIGRATION_TASK_FAMILY: pern-store-dev-backend-migrations
  FRONTEND_CONTAINER_NAME: pern-store-dev-frontend
  BACKEND_CONTAINER_NAME: pern-store-dev-backend
  MIGRATION_SUBNETS: ${{ vars.MIGRATION_SUBNETS }}
  MIGRATION_SECURITY_GROUPS: ${{ vars.MIGRATION_SECURITY_GROUPS }}

jobs:
  build-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      # Fetch the source code for the commit being deployed.
      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      # Get temporary AWS credentials without storing AWS access keys in GitHub.
      - name: Get short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Authenticate Docker so it can push the image to ECR.
      - name: Log in to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      # Reuse an existing commit tag on workflow reruns because ECR tags are immutable.
      - name: Check whether this immutable image tag already exists
        id: image_tag
        env:
          REPOSITORY: ${{ env.FRONTEND_ECR_REPO }}
        run: |
          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>ecr-error.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "ImageNotFoundException" ecr-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat ecr-error.txt >&2
            exit 1
          fi

      # Build the frontend and bake in only the relative API path.
      - name: Build and push the frontend image
        if: steps.image_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.ecr_login.outputs.registry }}/${{ env.FRONTEND_ECR_REPO }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api

      # Pass the full ECR URI to the deployment job.
      - name: Set the frontend image URI for deployment
        id: image
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: echo "image_uri=$REGISTRY/$FRONTEND_ECR_REPO:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy frontend service
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      # Fetch the shared ECS deployment helper.
      - name: Check out the deployment helper
        uses: actions/checkout@v4

      # Get temporary AWS credentials for ECS deployment.
      - name: Get short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Register a task definition revision, update the service, and wait for health.
      - name: Register a task definition with the new image and update ECS
        env:
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_SERVICE: ${{ env.FRONTEND_ECS_SERVICE }}
          TASK_FAMILY: ${{ env.FRONTEND_TASK_FAMILY }}
          CONTAINER_NAME: ${{ env.FRONTEND_CONTAINER_NAME }}
          IMAGE_URI: ${{ needs.build-frontend.outputs.image_uri }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: bash .github/scripts/deploy-ecs-service.sh

  build-backend:
    name: Build and push backend image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      # Fetch the source code for the commit being deployed.
      - name: Check out the commit being deployed
        uses: actions/checkout@v4

      # Get temporary AWS credentials without storing AWS access keys in GitHub.
      - name: Get short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Authenticate Docker so it can push the image to ECR.
      - name: Log in to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      # Reuse an existing commit tag on workflow reruns because ECR tags are immutable.
      - name: Check whether this immutable image tag already exists
        id: image_tag
        env:
          REPOSITORY: ${{ env.BACKEND_ECR_REPO }}
        run: |
          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>ecr-error.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "ImageNotFoundException" ecr-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat ecr-error.txt >&2
            exit 1
          fi

      # Build and push the backend, including its migration files.
      - name: Build and push the backend image
        if: steps.image_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.ecr_login.outputs.registry }}/${{ env.BACKEND_ECR_REPO }}:${{ github.sha }}

      # Pass the full ECR URI to migration and deployment jobs.
      - name: Set the backend image URI for deployment
        id: image
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
        run: echo "image_uri=$REGISTRY/$BACKEND_ECR_REPO:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  migrate-backend:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      # Fetch the migration helper script.
      - name: Check out the migration helper
        uses: actions/checkout@v4

      # Get temporary AWS credentials for ECS RunTask and task-definition registration.
      - name: Get short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Run the migration image in private subnets and fail unless it exits successfully.
      - name: Run database migrations
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          BACKEND_TASK_FAMILY: ${{ env.BACKEND_TASK_FAMILY }}
          MIGRATION_TASK_FAMILY: ${{ env.MIGRATION_TASK_FAMILY }}
          BACKEND_CONTAINER_NAME: ${{ env.BACKEND_CONTAINER_NAME }}
          IMAGE_URI: ${{ needs.build-backend.outputs.image_uri }}
          MIGRATION_SUBNETS: ${{ env.MIGRATION_SUBNETS }}
          MIGRATION_SECURITY_GROUPS: ${{ env.MIGRATION_SECURITY_GROUPS }}
        run: bash .github/scripts/run-ecs-migration.sh

  deploy-backend:
    name: Deploy backend service
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - migrate-backend
    steps:
      # Fetch the shared ECS deployment helper.
      - name: Check out the deployment helper
        uses: actions/checkout@v4

      # Get temporary AWS credentials for ECS deployment.
      - name: Get short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Register a task definition revision, update the service, and wait for health.
      - name: Register a task definition with the new image and update ECS
        env:
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_SERVICE: ${{ env.BACKEND_ECS_SERVICE }}
          TASK_FAMILY: ${{ env.BACKEND_TASK_FAMILY }}
          CONTAINER_NAME: ${{ env.BACKEND_CONTAINER_NAME }}
          IMAGE_URI: ${{ needs.build-backend.outputs.image_uri }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: bash .github/scripts/deploy-ecs-service.sh
